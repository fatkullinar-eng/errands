<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Поручения — сервис бытовых задач</title>
  <meta name="description" content="Сервис поручений: клиент создаёт задачу, исполнитель берёт и выполняет. Статусы, чат, админ-панель.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ea580c'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 7 9 18l-5-5"></path>
          </svg>
        </span>
        <div class="brand-text">
          <span class="brand-name">Поручения</span>
          <span class="brand-tag">сервис бытовых задач</span>
        </div>
      </div>

      <div class="topbar-actions">
        <div class="role-switch" role="group" aria-label="Роль">
          <button class="role-btn is-active" data-role="client">Клиент</button>
          <button class="role-btn" data-role="executor">Исполнитель</button>
          <button class="role-btn" data-role="admin">Админ</button>
        </div>
        <button class="icon-btn" id="themeToggle" title="Сменить тему" aria-label="Сменить тему">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="demo-strip">
      Демо-режим: роли переключаются вручную, данные хранятся в этом браузере.
    </div>

    <nav class="tabs" id="tabs" aria-label="Разделы"></nav>

    <main id="app" class="content"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
